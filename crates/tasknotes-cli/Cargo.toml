[package]
name = "tasknotes-cli"
version = "0.1.0"
edition = "2024"
description = "Local Tasknotes command line: structured JSON access to the shared core"

[lib]
name = "tasknotes_cli"
path = "src/lib.rs"

[[bin]]
name = "tasknotes"
path = "src/main.rs"

[dependencies]
tasknotes-core = { path = "../tasknotes-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
