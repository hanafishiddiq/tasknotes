[package]
name = "tasknotes-e2e"
version = "0.1.0"
edition = "2024"
description = "Release-quality tests across the real tasknotes and tasknotes-mcp binaries"
publish = false

# Cargo hands a test only the binaries of its own package, and MCP's tests
# cannot otherwise reach the CLI. These are the two products' own `main.rs`,
# so `CARGO_BIN_EXE_*` names exactly what ships, built from the same sources.
[[bin]]
name = "tasknotes"
path = "../tasknotes-cli/src/main.rs"
test = false

[[bin]]
name = "tasknotes-mcp"
path = "../tasknotes-mcp/src/main.rs"
test = false

# What those two `main.rs` need, at the versions they pin.
[dependencies]
tasknotes-core = { path = "../tasknotes-core" }
tasknotes-cli = { path = "../tasknotes-cli" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"

[dev-dependencies]
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10.9"
tempfile = "3"

# SQLite and the backup checksum are most of the time these tests spend, and
# a kill loop reads every database in full after every kill.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
