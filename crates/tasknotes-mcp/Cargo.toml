[package]
name = "tasknotes-mcp"
version = "0.1.0"
edition = "2024"
description = "Local Tasknotes MCP server over stdio: the shared core for trusted AI clients"

[[bin]]
name = "tasknotes-mcp"
path = "src/main.rs"

[dependencies]
tasknotes-core = { path = "../tasknotes-core" }
tasknotes-cli = { path = "../tasknotes-cli" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"

[dev-dependencies]
tempfile = "3"
