[package]
name = "tasknotes-core"
version = "0.1.0"
edition = "2024"
description = "Shared local-first Tasknotes domain and SQLite persistence"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
caseless = "0.2.2"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3"
