name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Issue 19 native QA protocol (synthetic unit tests)
        run: node --test qa/native/issue19-hover-ab.test.mjs
      - name: Issue 19 Inspector parser and cross-language protocol
        run: python3 -m unittest discover -s scripts/qa -p 'test_*.py'
      - run: pnpm build

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path crates/tasknotes-core/Cargo.toml
      - run: cargo fmt --manifest-path crates/tasknotes-core/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path crates/tasknotes-core/Cargo.toml --all-targets -- -D warnings
