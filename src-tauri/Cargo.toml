[package]
name = "tasknotes"
version = "0.1.0"
description = "Local-first Tasknotes desktop app"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tasknotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Opt-in only. Refused by the source code in release mode.
native-e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tasknotes-core = { path = "../crates/tasknotes-core" }
# Test-only embedded macOS WebDriver; never a default dependency.
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
# Execute API and active-window hints are scoped to the same opt-in QA build.
tauri-plugin-wdio = { version = "=1.5.0", optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
