[package]
name = "tasknotes"
version = "0.1.0"
description = "Local-first Tasknotes desktop app"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tasknotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Ticket 17's measuring build; see qa_probe.rs. Never in a build for real use.
qa-probe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tasknotes-core = { path = "../crates/tasknotes-core" }

# Global Quick Capture shortcut (Ticket 15); desktop only, used from Rust, no JS permissions.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "=2.4.1"

# Pomodoro notifications through UNUserNotificationCenter only (batch 3,
# Issue 06): posting with Start break / Count overtime / Start focus, the
# clicks, withdrawing an answered one, and the alert style for the one-time
# tip. No notification plugin: its macOS path is the older
# NSUserNotificationCenter, which macOS 27 refuses to an app that also uses
# this one.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSValue"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
